name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Clone EduPage2 repo
        run: |
          git clone https://github.com/DislikesSchool/EduPage2.git eduapp2

      - name: Fix broken Tamil ICU plurals in EduPage2
        run: |
          # Upstream app_ta.arb translated the ICU keyword "other" to Tamil
          # ("மற்ற"), which makes flutter gen-l10n fail with
          # "ICU Lexing Error: Unexpected character".
          # Repair it (harmless no-op if fixed upstream).
          sed -i 's/மற்ற{{count}/other{{count}/g' eduapp2/lib/l10n/app_ta.arb
          grep -c "other{{count}" eduapp2/lib/l10n/app_ta.arb

      - name: Get latest tag from EduPage2 repo
        id: get_tag
        run: |
          tag_json=$(curl -s https://api.github.com/repos/DislikesSchool/EduPage2/tags)
          latest_tag=$(echo "$tag_json" | jq -r '.[0].name')
          echo "Latest tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build EduPage2 web release
        working-directory: ./eduapp2
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build web --dart-define=BVS="Docker Test ${{ steps.get_tag.outputs.latest_tag }} Web"
          cp -r build/web ../cmd/server/web
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag vypal/edupage2-server:$(date +%s)
